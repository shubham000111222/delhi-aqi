name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: types
        run: mypy src           # blocking: the type pass is clean across src/tradebot
      - name: config sanity
        run: PYTHONPATH=src python -m tradebot check
      - name: tests
        run: PYTHONPATH=src python -m pytest
      - name: secrets scan
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline || true
